name: Production image transfer 15941b6b

on:
  push:
    branches: [codex/prod-image-15941b6b]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4

      - name: Build production image off-host
        run: |
          docker build \
            --label org.opencontainers.image.revision="15941b6b7efdd51e6e73c90213616d0ebfe13b7c" \
            --tag budgetpro-app:latest \
            .

      - name: Export compressed image
        run: docker save budgetpro-app:latest | gzip -1 > budgetpro-app-15941b6b.tar.gz

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgetpro-app-15941b6b
          path: budgetpro-app-15941b6b.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
