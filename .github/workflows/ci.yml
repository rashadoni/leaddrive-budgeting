# Phase 0.7 closure (2026-05-26) — CI pipeline.
#
# Mirrors the local pre-commit gate (secret scan + tsc + M7 scanner)
# and adds the broader suite (vitest + next build + RLS coverage gate)
# that pre-commit deliberately skips for latency reasons.
#
# Intentionally NOT here yet:
# - Playwright E2E: needs Postgres + dev server + LLM keys; will be a
#   separate job once those secrets land in repo settings.
# - Prisma migrate check: needs DATABASE_URL; same blocker.
#
# Bypass: nothing — CI cannot be skipped without admin merge override.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (all tracked files)
        # Re-uses the same scanner the pre-commit hook runs, in --scan-files
        # mode so we sweep every tracked file (not just the diff). xargs -0
        # splits into multiple invocations if argv overflows (~1600 files
        # today, well under the limit, but future-proofs the gate).
        run: |
          git ls-files -z | xargs -0 bash .githooks/pre-commit-secrets.sh --scan-files

      - name: Prisma generate
        # Required before tsc / vitest / build — Prisma client types live
        # in node_modules/.prisma and are referenced by the typed API code.
        run: npx prisma generate

      - name: TypeScript check
        env:
          # The project-wide graph now crosses Node's ~2 GiB default heap
          # ceiling on hosted runners. Match the existing production-build
          # allowance so tsc fails on types, not an arbitrary V8 limit.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx tsc --noEmit

      - name: RLS coverage gate
        # Phase 5.2 lock-in: fail the build if any `src/app/api/**/route.ts`
        # reads/writes org-scoped Prisma delegates OUTSIDE `withOrgScope` and
        # isn't a justified `// rls-scan-ignore:` opt-out, or uses a raw
        # `SET "app.*"` without LOCAL. Keeps the enforced-RLS surface at 0
        # unwrapped so a forgotten scope can't merge + silently leak on prod.
        # Report-only locally: `node scripts/rls-coverage-scan.mjs`.
        run: node scripts/rls-coverage-scan.mjs --enforce

      - name: RLS schema-coverage gate
        # Phase 12 / A04: the gate above checks CALL SITES; this one checks
        # TABLES. Audited on production 2026-08-02 — 70 of 76 tables had RLS,
        # and `guide_views` / `import_batch_reports` returned their full
        # contents to the app role regardless of tenant while the call-site
        # gate stayed green, because it never asks the database anything.
        run: node scripts/rls-schema-coverage-scan.mjs --enforce

      # Lint deliberately skipped: Next.js 16 removed `next lint`, and the
      # project has no standalone eslint config yet. Re-enable once
      # eslint.config.{js,ts} lands (separate cleanup task).

      - name: M7 status-band-shape scanner
        # Same regression gate the pre-commit hook runs (~300ms).
        run: npx vitest run src/features/terminal/components/m7-status-band-shape.test.ts --reporter=dot

      - name: Unit tests (vitest)
        # Integration tests requiring real Postgres are gated behind
        # RLS_INTEGRATION=1 and are intentionally NOT set here.
        run: npm test

      - name: Next.js build
        # Locks that the production build compiles end-to-end. Catches
        # bugs that tsc misses (e.g. server-component-only imports in a
        # client file). Skips static-page DB calls via build-time
        # short-circuits already in the routes.
        env:
          # next build needs a valid-looking DATABASE_URL even though we
          # don't query DB at build time; the Prisma client init throws
          # otherwise. Use a localhost URL that's never connected to.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
          NEXTAUTH_SECRET: 'ci-build-only-not-a-real-secret'
          NEXTAUTH_URL: 'http://localhost:3000'
          # 2026-08-04 — this build peaks just under node's ~2GB default
          # old-space ceiling, so it had started failing intermittently with
          # "Ineffective mark-compacts near heap limit": the SAME commit built
          # clean on one run and died at 2009MB on the next, and the prod image
          # build died the same way at 1.9GB on a 3.8GB server. Nothing about
          # the app needs 2GB-shaped bundles — the build is simply large enough
          # that the default ceiling is now a coin flip. Give it explicit
          # headroom instead of re-running until it's lucky.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build
