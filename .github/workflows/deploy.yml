name: Deploy (Cloud Run)

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to main)'
        required: false
        default: 'main'

concurrency:
  group: budgetpro-cloud-run-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE: budgetpro-web
  MIGRATION_JOB: budgetpro-migrate
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Прибито, а не ubuntu-latest: это движущийся алиас, и в день, когда
    # GitHub переставит его на следующий LTS, база образа меняется у всех
    # выкаток разом, без коммита, который можно было бы отбисектить.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION ARTIFACT_REPOSITORY WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push immutable image
        id: image
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/budgetpro:${RELEASE_SHA}"
          docker build --pull -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Capture rollback revision and stable URL
        id: current
        run: |
          set -euo pipefail
          revision=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          url=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          test -n "$revision"
          test -n "$url"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update and run the database migration job
        run: |
          set -euo pipefail
          common=(
            --project "$PROJECT_ID"
            --region "$REGION"
            --image "${{ steps.image.outputs.uri }}"
            --service-account "budgetpro-migration@${PROJECT_ID}.iam.gserviceaccount.com"
            --set-secrets DATABASE_URL=budgetpro-database-url:latest
            --command prisma
            --args "migrate,deploy"
            --max-retries 1
            --task-timeout 15m
            --quiet
          )
          if gcloud run jobs describe "$MIGRATION_JOB" \
            --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update "$MIGRATION_JOB" "${common[@]}"
          else
            gcloud run jobs create "$MIGRATION_JOB" "${common[@]}"
          fi
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$PROJECT_ID" --region "$REGION" --wait --quiet

      - name: Deploy and verify a zero-traffic candidate
        id: deploy
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          STABLE_URL: ${{ steps.current.outputs.url }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.image.outputs.uri }}" \
            --service-account "budgetpro-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port 3000 --cpu 1 --memory 1Gi --concurrency 5 --timeout 900 \
            --min 0 --max 1 --min-instances 0 --max-instances 1 --cpu-boost \
            --execution-environment gen2 --ingress all \
            --allow-unauthenticated --no-traffic \
            --set-secrets DATABASE_URL=budgetpro-database-url:latest,DATABASE_URL_ADMIN=budgetpro-database-url-admin:latest,DATABASE_URL_APP=budgetpro-database-url-app:latest,NEXTAUTH_SECRET=budgetpro-nextauth-secret:latest,ANTHROPIC_API_KEY=budgetpro-anthropic-api-key:latest,CRON_SECRET=budgetpro-cron-secret:latest \
            --set-env-vars NODE_ENV=production,AUTH_TRUST_HOST=true,NEXTAUTH_URL="${STABLE_URL}",QUEUE_BACKEND=inprocess,SERVERLESS_SYNC_RECOMPUTE=true,RUN_MIGRATIONS_ON_START=false,LOG_LEVEL=info,LLM_DAILY_TOKEN_CAP=600000,APP_REVISION="${RELEASE_SHA}" \
            --labels app=budgetpro,environment=pilot \
            --quiet

          revision=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          test -n "$revision"
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-tags "candidate=$revision" --quiet
          candidate_url=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '.status.traffic[] | select(.tag == "candidate") | .url')
          # Не просто «ответил 200». Старая ревизия отвечает 200 ровно так же,
          # поэтому неудавшееся переключение трафика выглядело бы успехом.
          # /api/health возвращает APP_REVISION, и мы сверяем его с SHA релиза:
          # это доказательство, что отвечает именно новый код.
          health=$(curl --fail --show-error --silent --retry 8 --retry-all-errors \
            --retry-delay 5 "${candidate_url}/api/health")
          printf '%s\n' "$health"
          serving_sha=$(printf '%s' "$health" | jq -er '.revision')
          if [ "$serving_sha" != "$RELEASE_SHA" ]; then
            echo "::error::кандидат отвечает ревизией $serving_sha, ожидалась $RELEASE_SHA"
            exit 1
          fi
          # База отдельно: приложение без неё бесполезно, а на трафик его
          # выпускать нельзя.
          printf '%s' "$health" | jq -er 'select(.db == "up")' >/dev/null

          curl --fail --show-error --silent --retry 5 --retry-all-errors \
            --retry-delay 3 "${candidate_url}/login" >/dev/null

          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --remove-tags candidate --to-revisions "$revision=100" --quiet
          serving=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          test "$serving" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Roll back traffic after a failed release
        if: failure() && steps.current.outputs.revision != ''
        run: |
          set -euo pipefail
          rollback_args=(--to-revisions "${{ steps.current.outputs.revision }}=100")
          if gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -e 'any(.status.traffic[]?; .tag == "candidate")' >/dev/null; then
            rollback_args+=(--remove-tags candidate)
          fi
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            "${rollback_args[@]}" --quiet

      - name: Deployment summary
        if: success()
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### BudgetPro Cloud Run deployment"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\`"
            echo "- Instances: \`min=0, max=1\`"
            echo "- Database migration completed before traffic promotion"
          } >> "$GITHUB_STEP_SUMMARY"
