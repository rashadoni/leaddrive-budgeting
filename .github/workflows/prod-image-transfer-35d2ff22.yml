name: Production image transfer 35d2ff22

on:
  push:
    branches: [codex/prod-image-35d2ff22]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4

      - name: Build production image off-host
        run: |
          docker build \
            --label org.opencontainers.image.revision="35d2ff2276f15631a7d2c563d49b89bb6180d241" \
            --tag budgetpro-app:latest \
            .

      - name: Export compressed image
        run: docker save budgetpro-app:latest | gzip -1 > budgetpro-app-35d2ff22.tar.gz

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgetpro-app-35d2ff22
          path: budgetpro-app-35d2ff22.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
