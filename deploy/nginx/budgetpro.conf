# BudgetPro — nginx reverse proxy
# Two blocks below: HTTP (always on) and HTTPS (enable once certs are in place).
# See deploy/README.md § TLS for Let's Encrypt / internal PKI setup.

# -----------------------------------------------------------------------------
# HTTP — listens on :80
#   • For initial deploy WITHOUT TLS: serves the app directly (leave as-is).
#   • Once TLS is in place: uncomment the `return 301` line and move the
#     location block into the HTTPS server below.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Once TLS is active, uncomment to force HTTPS:
    # return 301 https://$host$request_uri;

    # ACME challenge path for Let's Encrypt / certbot standalone mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # -------------------------------------------------------------------------
    # Phase 8 G3 F3 — API auth defence-in-depth at the nginx layer.
    #
    # Validates the session for /api/* BEFORE proxying to the app, via an
    # auth_request subrequest to the decode-only /api/_authcheck route
    # (getToken → 204 authed / 401 anon; no DB). This sheds unauthenticated
    # traffic at the edge. The per-route handler gates remain the source of
    # truth (audit: 0 exposed endpoints) — this is a redundant safety net.
    #
    # Done HERE (nginx) and NOT as a Next.js middleware, which wedges this
    # stack (NextAuth v5-beta + the custom proxy.ts layer + Turbopack) — see
    # docs/AUTH_GATE_AUDIT.md F3 for the two reverted middleware attempts.
    #
    # Excluded (must stay reachable without a session):
    #   - /api/auth/*               NextAuth's own login/csrf/session/callback
    #   - /api/telemetry/guide-view anonymous /guide view beacon (Phase 8 F2)
    #   - /api/_authcheck           the validator itself (internal-only)
    # -------------------------------------------------------------------------

    # Internal session validator — only reachable via auth_request subrequests.
    # NOTE the route folder is `src/app/api/authcheck` (NO leading underscore):
    # App Router treats `_`-prefixed folders as PRIVATE and excludes them from
    # routing, so the original `/api/_authcheck` 404'd for any authed subrequest
    # (proxy.ts 401'd anon requests before the missing route, which masked the
    # bug as "working" — anon→401 looked right). Keep this path in sync with the
    # folder name.
    location = /api/authcheck {
        internal;
        proxy_pass http://app:3000;
        # Clean HTTP/1.1 GET. The earlier `proxy_pass_request_body off` +
        # `Content-Length ""` combo malformed the subrequest enough that Next's
        # router fell through to the not-found handler (404) instead of the
        # authcheck route — surfacing as "auth request unexpected status: 404"
        # → a 500 on every gated /api/* call. The validator reads no body, so a
        # plain GET is all it needs.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host   $host;
        proxy_set_header Cookie $http_cookie;   # forward the session cookie
    }

    # JSON 401 for denied API requests (nicer than nginx's default HTML page).
    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"Unauthorized"}';
    }

    # NextAuth's own endpoints — PUBLIC (gating these breaks login itself).
    location ^~ /api/auth/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Anonymous /guide view-telemetry beacon (Phase 8 F2) — PUBLIC by design.
    location = /api/telemetry/guide-view {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 1M;
    }

    # All other /api/* — require a valid session (auth_request → 204 / 401).
    location /api/ {
        auth_request /api/authcheck;
        error_page 401 = @api_unauthorized;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25M;
    }

    # Phase 7.G Turn B closure — SSE LISTEN/NOTIFY stream MUST bypass
    # proxy buffering. Default `proxy_buffering on` would hold response
    # chunks in nginx's 4KB buffer until full or 30s timeout — users
    # would see no events for ~30s. Verify post-deploy:
    #   curl -N -H "Cookie: <session>" https://<host>/api/events/stream
    # → events should stream as they fire, not after a ~30s buffer fill.
    # Documented in docs/DEPLOYMENT_READINESS.md §6.5.
    location /api/events/stream {
        # Phase 8 G3 F3 — gate the live event stream too (don't push events to
        # anonymous clients). auth_request completes before the stream opens.
        auth_request /api/authcheck;
        error_page 401 = @api_unauthorized;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Connection        "keep-alive";

        # Critical for SSE: disable response buffering + caching so
        # events flush immediately to the client.
        proxy_buffering off;
        proxy_cache off;

        # Long timeouts so the long-poll connection doesn't get killed
        # by nginx mid-session.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE (Next.js uses these for dev HMR; harmless in prod).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer than Next.js default — AI Analytics streaming can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Excel import cap is 20 MB at the API level; add ~5 MB slack.
        client_max_body_size 25M;
    }
}

