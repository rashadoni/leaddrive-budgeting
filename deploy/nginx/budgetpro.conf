# BudgetPro — nginx reverse proxy
# Two blocks below: HTTP (always on) and HTTPS (enable once certs are in place).
# See deploy/README.md § TLS for Let's Encrypt / internal PKI setup.

# -----------------------------------------------------------------------------
# HTTP — listens on :80
#   • For initial deploy WITHOUT TLS: serves the app directly (leave as-is).
#   • Once TLS is in place: uncomment the `return 301` line and move the
#     location block into the HTTPS server below.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Once TLS is active, uncomment to force HTTPS:
    # return 301 https://$host$request_uri;

    # ACME challenge path for Let's Encrypt / certbot standalone mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Phase 7.G Turn B closure — SSE LISTEN/NOTIFY stream MUST bypass
    # proxy buffering. Default `proxy_buffering on` would hold response
    # chunks in nginx's 4KB buffer until full or 30s timeout — users
    # would see no events for ~30s. Verify post-deploy:
    #   curl -N -H "Cookie: <session>" https://<host>/api/events/stream
    # → events should stream as they fire, not after a ~30s buffer fill.
    # Documented in docs/DEPLOYMENT_READINESS.md §6.5.
    location /api/events/stream {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Connection        "keep-alive";

        # Critical for SSE: disable response buffering + caching so
        # events flush immediately to the client.
        proxy_buffering off;
        proxy_cache off;

        # Long timeouts so the long-poll connection doesn't get killed
        # by nginx mid-session.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE (Next.js uses these for dev HMR; harmless in prod).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer than Next.js default — AI Analytics streaming can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Excel import cap is 20 MB at the API level; add ~5 MB slack.
        client_max_body_size 25M;
    }
}

