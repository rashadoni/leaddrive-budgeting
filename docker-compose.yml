# BudgetPro — production stack (app + Postgres + Nginx)
# Target: FO Holding VM at PASHA Technology.
# Usage on the VM:
#   cp .env.production.example .env.production
#   # edit .env.production with real secrets
#   docker compose --env-file .env.production up -d --build
# See deploy/README.md for the full runbook.

services:
  db:
    image: postgres:16-alpine
    container_name: budgetpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Explicit initdb args avoid locale-mismatch surprises on minimal hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # DB is NOT published to the host — only reachable via the internal Docker
    # network. If you need direct access for backups/admin, exec into the
    # container or tunnel over SSH.
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: budgetpro-app:latest
    container_name: budgetpro-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # NextAuth v5 refuses to start behind a reverse proxy unless the host is
      # explicitly trusted — nginx forwards the original Host header but Auth.js
      # can't verify it from inside the container. Safe behind our nginx config.
      AUTH_TRUST_HOST: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Per-org LLM token ceilings (see src/lib/llm/cost-budget.ts). Unset =
      # the built-in 500K/day, 10M/month. Raise here + restart; no release.
      LLM_DAILY_TOKEN_CAP: ${LLM_DAILY_TOKEN_CAP:-}
      LLM_MONTHLY_TOKEN_CAP: ${LLM_MONTHLY_TOKEN_CAP:-}
      # R4 (audit round 2) — bearer for /api/cron/* (trade-digest crontab).
      CRON_SECRET: ${CRON_SECRET:-}
      # RLS Stage 3 (S6) — RLS-enforced app role + BYPASSRLS admin role.
      # Empty until the roles are provisioned on this host (runbook §1 +
      # scripts/sql/create-app-role.sql); prisma-app/prisma-admin fall
      # back to DATABASE_URL when unset, so this passthrough is inert
      # until the .env values exist. DATABASE_URL itself stays on the
      # superuser: the docker-entrypoint migration step needs it.
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN:-}
      # Risk Terminal 2.0 operational rollout flags. Defaults keep every org
      # on the legacy Expert view and prevent paid AI from starting on entry.
      # Enabling V2 still requires both the master switch and an exact org id
      # in the allowlist (resolved server-side; never exposed as NEXT_PUBLIC_*).
      RISK_TERMINAL_V2_ENABLED: ${RISK_TERMINAL_V2_ENABLED:-false}
      RISK_TERMINAL_V2_ORG_ALLOWLIST: ${RISK_TERMINAL_V2_ORG_ALLOWLIST:-}
      RISK_TERMINAL_V2_DEFAULT_VIEW: ${RISK_TERMINAL_V2_DEFAULT_VIEW:-expert}
      RISK_TERMINAL_V2_AI_AUTORUN: ${RISK_TERMINAL_V2_AI_AUTORUN:-false}
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: budgetpro-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/budgetpro.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/acme:/var/www/certbot:ro
    networks:
      - internal

volumes:
  pgdata:
    driver: local

networks:
  internal:
    driver: bridge
